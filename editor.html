<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无归之城 - 剧情编辑器</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; margin: 0; background: #f0f0f0; }
        #sidebar { width: 250px; background: #333; color: white; overflow-y: auto; display: flex; flex-direction: column; }
        #sidebar h3 { padding: 10px; margin: 0; background: #222; }
        .identity-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #444; }
        .identity-item:hover { background: #444; }
        .identity-item.active { background: #555; font-weight: bold; }
        
        #node-list { flex: 1; overflow-y: auto; background: #ddd; color: #333; }
        .node-item { padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #ccc; }
        .node-item:hover { background: #eee; }
        .node-item.active { background: #fff; border-left: 4px solid #333; }

        #editor-area { flex: 1; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        textarea { width: 100%; height: 100px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        #choices-editor { border: 1px solid #ccc; padding: 10px; background: #fff; border-radius: 4px; }
        .choice-item { border: 1px solid #eee; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .btn { padding: 8px 15px; background: #333; color: white; border: none; cursor: pointer; border-radius: 4px; margin-right: 5px; }
        .btn:hover { background: #555; }
        .btn-danger { background: #d9534f; }
        .btn-success { background: #5cb85c; }

        #toolbar { padding: 10px; background: #fff; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        * {box-sizing:border-box;} #toolbar {flex-wrap:wrap;gap:8px;} #sidebar {flex-shrink:0;} .identity-item,.node-item {display:block;width:100%;text-align:left;border:0;font:inherit;min-height:36px;} .identity-item {color:white;background:#333;} .node-item {background:#ddd;} #sidebar input {width:100%;padding:10px;} #draft-status {color:#365b36;padding:8px;} #node-references {line-height:1.8;padding:10px;background:#eee;margin-bottom:12px;} dialog {max-height:85vh;overflow:auto;width:min(620px,calc(100% - 24px));border:1px solid #555;} dialog::backdrop {background:#0008;} dialog button {padding:10px;margin:5px;min-height:44px;} #preview-choices button {display:block;} :focus-visible {outline:3px solid #ad5b19;outline-offset:2px;}
        @media(max-width:700px) {body {height:auto;min-height:100vh;flex-direction:column;} #sidebar {width:100%;max-height:none;} #identity-list {max-height:100px;overflow:auto;flex:none;} #node-list {flex:none;max-height:150px;overflow:auto;} #sidebar h3,#sidebar label,#sidebar input {flex:none;} #toolbar,#editor-area {padding:12px;} #toolbar h2 {font-size:1.2rem;} #toolbar button {margin:4px;} #editor-area {overflow:visible;} }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>身份列表</h3>
    <div id="identity-list"></div>
    <h3>节点列表 <button class="btn btn-success" style="font-size: 12px; padding: 2px 5px;" onclick="addNode()">+</button></h3>
    <label for="node-search">搜索节点</label><input id="node-search" placeholder="ID 或剧情文字">
    <div id="node-list"></div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
    <div id="toolbar">
        <h2>剧情节点编辑</h2>
        <div>
            <button id="undo-btn" class="btn">撤销</button><button id="redo-btn" class="btn">重做</button>
            <button id="import-btn" class="btn">导入 JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden>
            <button id="export-identity" class="btn">导出当前身份 JS</button>
            <button class="btn" onclick="exportData()">导出 JSON (完整备份)</button>
        </div>
    </div>

    <div id="editor-area">
        <div id="draft-status" role="status"></div>
        <div id="editor-error" role="alert" aria-live="polite" style="display:none; color:#a00; background:#fff0f0; padding:12px; margin-bottom:15px;"></div>
        <div id="no-selection" style="text-align:center; margin-top:50px; color:#888;">
            请在左侧选择一个身份和节点开始编辑
        </div>

        <div id="edit-form" style="display:none;">
            <div class="form-group">
                <label>节点 ID (Key)</label>
                <input type="text" id="node-key" disabled style="background:#eee;">
            </div>
            <div class="form-group">
                <label>剧情文本</label>
                <textarea id="node-text"></textarea>
            </div>
            <div class="form-group">
                <label>选项 (Choices)</label>
                <div id="choices-editor"></div>
                <button class="btn" style="margin-top:10px;" onclick="addChoice()">添加选项</button>
            </div>
            <div id="node-references"></div>
            <button id="preview-btn" class="btn">预览当前节点</button>
            <div class="form-group">
                <button class="btn btn-success" onclick="saveCurrentNode()">保存当前节点修改</button>
                <button class="btn btn-danger" onclick="deleteCurrentNode()">删除节点</button>
            </div>
        </div>
    </div>
</div>

<dialog id="unsaved-modal" aria-labelledby="unsaved-title"><h3 id="unsaved-title">有未保存的修改</h3><p>切换前如何处理？</p><button id="draft-save">保存并继续</button><button id="draft-discard">放弃修改</button><button id="draft-cancel">取消切换</button></dialog>
<dialog id="preview-modal" aria-labelledby="preview-title"><h3 id="preview-title">剧情预览</h3><p>完整长篇从序章开始，通过实际选择建立进度和条件。</p><label>携带物品（逗号分隔）<input id="preview-items"></label><button id="preview-restart">重新预览</button><div id="preview-status"></div><p id="preview-text"></p><div id="preview-choices"></div><button id="preview-close">关闭</button></dialog>
<script type="module" src="js/editor/editor.js"></script>

</body>
</html>
