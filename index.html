<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>无归之城｜No Way Out</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css?v=0.4.1">
</head>
<body>
  <div class="background-effect"></div>

  <div id="title-screen">
    <h1>无归之城</h1>
    <h2>No Way Out</h2>
    <button id="start-btn">开始游戏</button>
    <button id="continue-btn" hidden>继续游戏</button>
    <div style="margin-top: 20px;">
      <button id="load-btn-title" class="secondary-btn">读取存档</button>
      <button id="endings-btn">结局收藏</button>
      <button id="saves-btn-title" class="secondary-btn">存档管理</button>
      <button id="settings-btn-title" class="secondary-btn">设置</button>
    </div>
  </div>

  <dialog id="settings-modal" aria-labelledby="settings-heading">
    <h3 id="settings-heading">设置</h3>
    <label>音乐音量 <input type="range" id="bgm-volume" min="0" max="1" step="0.1" value="0.5"></label>
    <label>音效音量 <input type="range" id="sfx-volume" min="0" max="1" step="0.1" value="0.5"></label>
    <label>文字速度 <select id="reading-speed"><option value="60">慢</option><option value="30">正常</option><option value="15">快</option><option value="0">立即显示</option></select></label>
    <label>文字大小 <select id="reading-size"><option value="18">小</option><option value="20">标准</option><option value="24">大</option></select></label>
    <label><input type="checkbox" id="reduced-motion">减少动画</label>
    <button id="close-settings">关闭</button>
  </dialog>
  <dialog id="save-modal" aria-labelledby="save-heading">
    <h3 id="save-heading">存档管理</h3><p>自动档随游戏进度更新，手动档可独立保存。</p>
    <div id="save-slots"></div><button id="close-saves">关闭</button>
  </dialog>
  <dialog id="history-modal" aria-labelledby="history-heading">
    <h3 id="history-heading">剧情回顾</h3><div id="history-list"></div><button id="close-history">关闭</button>
  </dialog>
  <dialog id="endings-modal" aria-labelledby="endings-heading"><h3 id="endings-heading">结局收藏</h3><div id="endings-list"></div><button id="close-endings">关闭</button></dialog>
  <div id="notifications" role="status" aria-live="polite"></div>

  <div id="identity-screen" style="display:none;">
    <h2 id="identity-title">选择你的身份</h2>
    <div id="intro-text">1937年冬天，南京城陷入战火。你将以不同的身份经历这座城的绝望与挣扎。选择一个身份，决定你的生死与命运。</div>
    <div id="identity-description"></div>
    <div id="identity-list"></div>
    <div>
      <button id="confirm-identity" style="display:none;">确认</button>
      <button id="reselect-identity" style="display:none;">重新选择</button>
    </div>
  </div>

  <div id="game-container" style="display:none;">
    <div id="status-bar">
        <div id="health-display">生命：100</div>
        <div id="survival-status" hidden></div>
        <div id="sanity-display" style="margin-left: 15px;">理智：100</div>
        <details id="inventory" open><summary>物品</summary><div id="inventory-display"></div></details>
        <div class="game-toolbar">
            <button id="save-btn">保存</button>
            <button id="saves-btn-game">存档</button>
            <button id="history-btn">回顾</button>
            <button id="settings-btn-game">设置</button>
        </div>
    </div>
    <div id="chapter-heading"></div>
    <div id="dialogue-area">
        <div id="dialogue-text"></div>
    </div>
    <button id="skip-text" class="skip-button" hidden>显示全文（空格）</button>
    <div id="choices-area" aria-label="行动选择"></div>
  </div>

  <script type="module" src="js/game.js?v=0.4.1"></script>
  <!-- Effects are loaded by game.js now -->
</body>
</html>
