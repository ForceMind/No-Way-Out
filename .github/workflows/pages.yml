name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate stories and game rules
        run: |
          node scripts/validate-stories.mjs --verbose
          node --test --test-isolation=none tests/unit/*.test.mjs
          node scripts/content-catalog.mjs
          git diff --exit-code -- ENDING_CATALOG.md
      - name: Build static game
        run: |
          python scripts/build-release.py
          python -c 'import json, os; from pathlib import Path; Path("dist/no-way-out/deployment.json").write_text(json.dumps({"commit": os.environ["GITHUB_SHA"]}) + "\n")'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/no-way-out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Use GitHub Actions as the Pages build source
        id: pages_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          printf '::notice title=Pages build source::%s\n' "$source_type"
          printf 'build_type=%s\n' "$source_type" >> "$GITHUB_OUTPUT"
          if [ "$source_type" != "workflow" ]; then
            if ! gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --silent; then
              printf '::warning title=Pages Source setting::Publishing is permitted, but changing Source requires a repository administrator. Set Settings > Pages > Source to GitHub Actions to prevent legacy builds from replacing this release.\n'
            fi
          fi
      - name: Wait for the existing legacy Pages build
        if: steps.pages_source.outputs.build_type != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            remaining=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '[.workflow_runs[] | select((.path // "" | contains("pages-build-deployment")) or (.name // "" | ascii_downcase | contains("pages build"))) | select(.status != "completed")] | length')
            printf 'Legacy Pages builds still running: %s\n' "$remaining"
            if [ "$remaining" = "0" ]; then
              exit 0
            fi
            sleep 5
          done
          printf '::error title=Legacy Pages build::The existing Pages build did not finish before the publication timeout.\n'
          exit 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the published commit and every static file
        run: python scripts/verify-pages.py '${{ needs.deploy.outputs.page_url }}' --commit '${{ github.sha }}'
