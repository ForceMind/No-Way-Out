name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/no-way-out-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate stories and game rules
        run: |
          node scripts/validate-stories.mjs --verbose
          node --test --test-isolation=none tests/unit/*.test.mjs
          node scripts/content-catalog.mjs
          git diff --exit-code -- ENDING_CATALOG.md
      - name: Build static game
        run: python scripts/build-release.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/no-way-out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
