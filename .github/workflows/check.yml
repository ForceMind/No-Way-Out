name: Game checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Story and actual unit cases
        run: |
          node scripts/validate-stories.mjs --verbose
          node --test --test-isolation=none tests/unit/*.test.mjs
          node scripts/content-catalog.mjs
          git diff --exit-code -- ENDING_CATALOG.md
      - name: Browser dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Game and editor regression
        run: |
          python tests/e2e/smoke.py
          python tests/e2e/campaigns.py
      - name: Package and verify static paths
        run: |
          python scripts/build-release.py
          python tests/e2e/release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-check-results
          path: |
            test-results/
            dist/
          if-no-files-found: ignore
          retention-days: 7
